<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitZone — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-wrap { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 20px; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand .logo { font-family: 'Orbitron', monospace; font-size: 2.2rem; font-weight: 900; color: var(--neon); text-shadow: var(--glow); letter-spacing: 4px; }
    .brand p { color: var(--muted); margin-top: 6px; font-size: .95rem; }
    .tab-row { display: flex; margin-bottom: 22px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .tab-row button { flex: 1; padding: 12px; background: transparent; border: none; color: var(--muted); font-family: 'Orbitron', monospace; font-size: .75rem; letter-spacing: 2px; cursor: pointer; transition: .2s; }
    .tab-row button.active { background: rgba(0,255,180,.12); color: var(--neon); }
    .orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    .orb1 { width:400px;height:400px;background:rgba(0,255,180,.07);top:-80px;left:-80px; }
    .orb2 { width:300px;height:300px;background:rgba(0,200,255,.06);bottom:-60px;right:-60px; }
  </style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="auth-wrap">
  <div class="brand">
    <div class="logo">FITZONE</div>
    <p>Your cloud fitness companion</p>
  </div>

  <div class="card">
    <div class="tab-row">
      <button class="active" id="tabLogin" onclick="switchTab('login')">LOGIN</button>
      <button id="tabSignup" onclick="switchTab('signup')">SIGN UP</button>
    </div>

    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">

    <div id="loginForm">
      <button class="btn btn-primary" onclick="login()">Login</button>
    </div>
    <div id="signupForm" style="display:none;">
      <button class="btn btn-primary" onclick="signup()">Create Account</button>
    </div>

    <p style="text-align:center;margin-top:16px;font-size:.85rem;color:var(--muted);">
      <a href="index.html" style="color:var(--neon);text-decoration:none;">← Back to home</a>
    </p>
  </div>
</div>

<script>
function switchTab(t) {
  document.getElementById("loginForm").style.display  = t==="login"  ? "block" : "none";
  document.getElementById("signupForm").style.display = t==="signup" ? "block" : "none";
  document.getElementById("tabLogin").classList.toggle("active",  t==="login");
  document.getElementById("tabSignup").classList.toggle("active", t==="signup");
}
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="js/app.js"></script>
</body>
</html>
