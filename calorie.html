<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitZone — Calorie Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">FIT<span>ZONE</span></a>
  <div class="nav-links"><a href="dashboard.html">Dashboard</a></div>
</nav>

<div class="container">
  <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

  <div class="page-header">
    <span class="icon">🔥</span>
    <h1>Calorie Tracker</h1>
    <p>Log and monitor your daily intake</p>
  </div>

  <div class="stat-row">
    <div class="stat-box">
      <div class="val" id="totalCalories">0</div>
      <div class="lbl">Calories Today</div>
    </div>
    <div class="stat-box">
      <div class="val" style="color:var(--neon2);">2500</div>
      <div class="lbl">Daily Target</div>
    </div>
  </div>

  <div class="card">
    <h3>Progress</h3>
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:.85rem;color:var(--muted);">
      <span>0 kcal</span><span>2500 kcal</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="calBar" style="width:0%;"></div>
    </div>
  </div>

  <div class="card">
    <h3>Log Calories</h3>
    <label>Calories (kcal)</label>
    <input type="number" id="calories" placeholder="e.g. 350">
    <button class="btn btn-primary" onclick="addCalories()">+ Add Entry</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="js/app.js"></script>
</body>
</html>
