<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitZone — Water Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">FIT<span>ZONE</span></a>
  <div class="nav-links"><a href="dashboard.html">Dashboard</a></div>
</nav>

<div class="container">
  <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

  <div class="page-header">
    <span class="icon">💧</span>
    <h1>Water Tracker</h1>
    <p>Stay hydrated — aim for 8 glasses a day</p>
  </div>

  <div class="stat-row">
    <div class="stat-box">
      <div class="val" style="color:var(--neon2);" id="waterCount">0</div>
      <div class="lbl">Glasses Today</div>
    </div>
    <div class="stat-box">
      <div class="val" style="color:var(--muted);">8</div>
      <div class="lbl">Daily Target</div>
    </div>
  </div>

  <div class="card">
    <h3>Daily Progress</h3>
    <div class="progress-track">
      <div class="progress-fill" id="waterBar" style="width:0%;background:linear-gradient(90deg,var(--neon2),#004fcc);"></div>
    </div>
    <!-- 8 glass visuals -->
    <div class="glass-grid" id="glassGrid">
      <div class="glass-btn"><div class="fill"></div></div>
      <div class="glass-btn"><div class="fill"></div></div>
      <div class="glass-btn"><div class="fill"></div></div>
      <div class="glass-btn"><div class="fill"></div></div>
      <div class="glass-btn"><div class="fill"></div></div>
      <div class="glass-btn"><div class="fill"></div></div>
      <div class="glass-btn"><div class="fill"></div></div>
      <div class="glass-btn"><div class="fill"></div></div>
    </div>
  </div>

  <div class="card" style="text-align:center;">
    <button class="btn btn-primary" onclick="addWater()" style="max-width:260px;">💧 &nbsp;Log a Glass</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="js/app.js"></script>
</body>
</html>
