<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitZone — BMI Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">FIT<span>ZONE</span></a>
  <div class="nav-links"><a href="dashboard.html">Dashboard</a></div>
</nav>

<div class="container">
  <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

  <div class="page-header">
    <span class="icon">📏</span>
    <h1>BMI Calculator</h1>
    <p>Find out where you stand</p>
  </div>

  <div class="card">
    <h3>Your Measurements</h3>
    <label>Height (cm)</label>
    <input type="number" id="height" placeholder="e.g. 165">
    <label>Weight (kg)</label>
    <input type="number" id="weightBMI" placeholder="e.g. 60">
    <button class="btn btn-primary" onclick="calculateBMI()">Calculate BMI</button>
    <div class="result-box" id="bmiResult" style="margin-top:18px;min-height:80px;flex-direction:column;gap:4px;">
      Your result will appear here
    </div>
  </div>

  <div class="card">
    <h3>BMI Scale</h3>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;justify-content:space-between;padding:10px 14px;border-radius:8px;background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.2);">
        <span style="color:#00c8ff;font-weight:600;">Under 18.5</span><span style="color:var(--muted);">Underweight</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:10px 14px;border-radius:8px;background:rgba(0,255,180,.08);border:1px solid rgba(0,255,180,.2);">
        <span style="color:#00ffb4;font-weight:600;">18.5 – 24.9</span><span style="color:var(--muted);">Normal ✅</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:10px 14px;border-radius:8px;background:rgba(255,180,0,.08);border:1px solid rgba(255,180,0,.2);">
        <span style="color:#ffb400;font-weight:600;">25 – 29.9</span><span style="color:var(--muted);">Overweight</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:10px 14px;border-radius:8px;background:rgba(255,64,96,.08);border:1px solid rgba(255,64,96,.2);">
        <span style="color:#ff4060;font-weight:600;">30 and above</span><span style="color:var(--muted);">Obese</span>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="js/app.js"></script>
</body>
</html>
